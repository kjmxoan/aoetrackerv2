<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>AOE Live Chat & Star Overlay OBS (Transparent Text Only — AOE BY XO)</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/brand-tokens.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Inter:wght@600;700;800;900&display=swap');
    html, body {
      font-family: 'Inter', sans-serif;
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    .font-honor {
      font-family: 'Chakra Petch', 'Inter', sans-serif;
    }
    /* Viền đen sắc nét bao quanh chữ để đọc rõ trên mọi địa hình bản đồ AOE mà KHÔNG cần khung nền */
    .stroke-text {
      text-shadow:
        -1.5px -1.5px 0 #000000,
         1.5px -1.5px 0 #000000,
        -1.5px  1.5px 0 #000000,
         1.5px  1.5px 0 #000000,
         0px    2px   6px rgba(0, 0, 0, 0.95);
    }
    .stroke-gold {
      text-shadow:
        -1.5px -1.5px 0 #000000,
         1.5px -1.5px 0 #000000,
        -1.5px  1.5px 0 #000000,
         1.5px  1.5px 0 #000000,
         0px    0px   12px rgba(251, 191, 36, 0.85);
    }
    .msg-item {
      animation: slideIn 0.22s ease-out;
    }
    @keyframes slideIn {
      from { transform: translateX(-10px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes floatUp {
      0% { transform: translateY(20px) scale(0.5); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-130px) scale(1.35); opacity: 0; }
    }
    .star-float {
      position: absolute;
      pointer-events: none;
      animation: floatUp 2.6s ease-out forwards;
    }
  </style>
</head>
<body class="p-2">
  <div id="app" class="w-[370px] relative select-none" style="background: transparent !important;">
    <!-- Hiệu ứng sao bay khi có người tặng sao -->
    <span v-for="st in starParticles" :key="st.id"
          class="star-float text-2xl z-50 stroke-gold"
          :style="{ left: st.left + '%', bottom: '40px', animationDelay: st.delay + 's' }">
      {{ st.icon }}
    </span>

    <!-- Khung hoàn toàn trong suốt, chỉ hiển thị chữ có viền đen sắc nét -->
    <div class="flex flex-col justify-end min-h-[380px] max-h-[480px] overflow-hidden" style="background: transparent !important;">

      <!-- Dòng tiêu đề nhỏ gọn chỉ gồm chữ trong suốt (ẩn khi không có bình luận/sao) -->
      <div v-if="displayMessages.length > 0 || totalStars > 0"
           class="flex items-center justify-between px-1 pb-1.5 stroke-text">
        <div class="flex items-center gap-1.5">
          <img src="/logo.svg" alt="AOE BY XO" class="w-4 h-4 object-contain drop-shadow" />
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="font-honor text-[12px] font-extrabold text-amber-300 uppercase tracking-wider">
            LIVE CHAT {{ streamerFilter ? ('• MÁY ' + streamerFilter) : '• AOE BY XO' }}
          </span>
        </div>
        <div v-if="totalStars > 0" class="font-honor text-[12px] font-black text-amber-300 stroke-gold">
          ⭐ {{ totalStars }} Sao
        </div>
      </div>

      <!-- Khung Vinh Danh Hoàng Gia khi có người vừa Tặng Sao / Vật phẩm AOE -->
      <div v-if="activeStarGift"
           class="aoe-honor-plate px-3 py-2 mb-2 flex items-center gap-2.5 msg-item shadow-xl">
        <span class="text-2xl aoe-honor-emblem shrink-0">{{ activeStarGift.giftIcon || '🌟' }}</span>
        <div class="flex-1 min-w-0">
          <div class="font-honor text-[13px] font-black text-amber-300 leading-tight">
            <span class="bg-amber-400 text-slate-950 text-[9px] px-1.5 py-0.5 rounded uppercase mr-1">👑 Vinh Danh</span>
            <template v-if="activeStarGift.giftName && activeStarGift.giftCode && activeStarGift.giftCode !== 'STAR'">
              {{ activeStarGift.senderName }} tặng {{ activeStarGift.giftIcon }} {{ activeStarGift.giftName.toUpperCase() }} (+{{ activeStarGift.starCount }} ⭐)!
            </template>
            <template v-else>
              {{ activeStarGift.senderName }} tặng +{{ activeStarGift.starCount }} ⭐!
            </template>
          </div>
          <div class="text-[11px] font-bold text-amber-100 italic truncate mt-0.5">
            "{{ activeStarGift.message }}"
          </div>
        </div>
      </div>

      <!-- Danh sách tin nhắn bình luận: Nền trong suốt 100%, chỉ hiện chữ để không che bản đồ/quân trong game -->
      <div ref="chatListRef" class="space-y-1.5 px-1 overflow-y-hidden flex flex-col justify-end" style="background: transparent !important;">
        <div v-for="m in displayMessages" :key="m.id"
             class="msg-item text-[13px] leading-snug break-words stroke-text"
             style="background: transparent !important;">
          <span v-if="m.type === 'STAR' || m.type === 'STAR_GIFT'" class="font-black text-amber-300 stroke-gold">
            {{ m.giftIcon || '🌟' }} {{ m.senderName }}: {{ m.text || m.message }}
          </span>
          <template v-else>
            <span class="font-extrabold" :class="(m.source === 'FACEBOOK' || m.senderTier === 'FACEBOOK') ? 'text-blue-400' : 'text-sky-300'">
              <span v-if="m.source === 'FACEBOOK' || m.senderTier === 'FACEBOOK'" class="text-[#38bdf8]">🔵 [FB] </span>
              <span v-else-if="m.senderTier === 'DIAMOND'">💎 </span>
              <span v-else-if="m.senderTier === 'GOLD'">🥇 </span>
              {{ m.senderName }}:
            </span>
            <span class="font-bold text-white ml-1">{{ m.text || m.message }}</span>
          </template>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '/api';
    Vue.createApp({
      data() {
        return {
          streamerFilter: '',
          match: null,
          messages: [],
          activeStarGift: null,
          starParticles: [],
          starTimer: null
        };
      },
      computed: {
        displayMessages() {
          return this.messages.slice(-10);
        },
        totalStars() {
          return (this.match && this.match.starsCount) || 0;
        }
      },
      methods: {
        triggerStarEffect(gift) {
          if (!gift) return;
          if (this.streamerFilter && gift.streamerName &&
              gift.streamerName.toLowerCase() !== this.streamerFilter.toLowerCase()) {
            return;
          }
          const icons = (Array.isArray(gift.particles) && gift.particles.length > 0)
            ? gift.particles
            : ((Array.isArray(gift.giftParticles) && gift.giftParticles.length > 0)
                ? gift.giftParticles
                : [gift.giftIcon || '⭐', '🌟', '✨', '💫']);
          this.starParticles = Array.from({ length: 12 }, (_, idx) => ({
            id: Date.now() + '_' + idx,
            left: 10 + Math.floor(Math.random() * 80),
            delay: (Math.random() * 0.6).toFixed(2),
            icon: icons[idx % icons.length]
          }));
          this.activeStarGift = gift;
          if (this.starTimer) clearTimeout(this.starTimer);
          this.starTimer = setTimeout(() => {
            this.activeStarGift = null;
            this.starParticles = [];
          }, 5000);
        },
        async fetchChatData() {
          const query = new URLSearchParams(location.search);
          this.streamerFilter = (query.get('streamer') || query.get('player') || '').trim();
          try {
            const res = await fetch(`${API_URL}?action=getInitialData&streamer=${encodeURIComponent(this.streamerFilter)}`);
            const data = await res.json();
            this.match = data.currentMatch || null;
            if (this.match && Array.isArray(this.match.chatMessages) && this.match.chatMessages.length > 0) {
              this.messages = this.match.chatMessages;
            } else if (Array.isArray(data.recentChat)) {
              this.messages = this.streamerFilter
                ? data.recentChat.filter(c => String(c.streamerName || '').toLowerCase() === this.streamerFilter.toLowerCase())
                : data.recentChat;
            }
          } catch (e) {}
        },
        connectStream() {
          try {
            const es = new EventSource('/api/stream');
            es.onmessage = (ev) => {
              try {
                const payload = JSON.parse(ev.data);
                if (payload.type === 'chat_message' && payload.chat) {
                  if (!this.streamerFilter || String(payload.streamerName || '').toLowerCase() === this.streamerFilter.toLowerCase()) {
                    if (!this.messages.some(m => m.id === payload.chat.id)) {
                      this.messages.push(payload.chat);
                    }
                  }
                } else if (payload.type === 'star_gifted') {
                  if (payload.chat && (!this.streamerFilter || String(payload.streamerName || '').toLowerCase() === this.streamerFilter.toLowerCase())) {
                    if (!this.messages.some(m => m.id === payload.chat.id)) {
                      this.messages.push(payload.chat);
                    }
                  }
                  if (payload.gift) {
                    this.triggerStarEffect(payload.gift);
                    if (this.match && payload.gift.totalMatchStars) {
                      this.match.starsCount = payload.gift.totalMatchStars;
                    }
                  }
                } else {
                  this.fetchChatData();
                }
              } catch (err) {}
            };
          } catch (e) {}
        }
      },
      mounted() {
        this.fetchChatData();
        this.connectStream();
        setInterval(this.fetchChatData, 4500);
      }
    }).mount('#app');
  </script>
</body>
</html>
